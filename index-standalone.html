    // Screen Touch Hearts Burst
    function TouchHearts() {
      const [ripples, setRipples] = useState([]);

      useEffect(() => {
        const handleTouchOrClick = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          if (!clientX && !clientY) return;

          const id = Date.now() + Math.random();
          const icons = ['💖', '💕', '✨', '🌸', '❤️'];
          const icon = icons[Math.floor(Math.random() * icons.length)];

          setRipples((prev) => [...prev.slice(-15), { id, x: clientX, y: clientY, icon }]);
          setTimeout(() => setRipples((prev) => prev.filter((r) => r.id !== id)), 900);
        };

        window.addEventListener('click', handleTouchOrClick);
        window.addEventListener('touchstart', handleTouchOrClick, { passive: true });
        return () => {
          window.removeEventListener('click', handleTouchOrClick);
          window.removeEventListener('touchstart', handleTouchOrClick);
        };
      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none z-50 overflow-hidden">
          {ripples.map((r) => (
            <span
              key={r.id}
              className="absolute select-none animate-touch-burst text-xl sm:text-2xl"
              style={{ left: `${r.x - 12}px`, top: `${r.y - 16}px` }}
            >
              {r.icon}
            </span>
          ))}
        </div>
      );
    }

    // Floating Ambient Hearts

      const particles = useMemo(() => {

          type: i % 3 === 0 ? '💖' : i % 3 === 1 ? '🌸' : '✨',

      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
          {particles.map((p) => (
            <span
              key={p.id}
              className="absolute select-none"
              style={{
                left: `${p.left}%`,

                animation: `floatUp ${p.duration}s ease-in-out infinite`,

              ))}
            </div>
            <div className="mt-6 pt-3 border-t border-rose-200/60 text-center">
              <p className="text-[10px] uppercase tracking-widest text-gray-400 font-semibold">All My Love Forever,</p>
              <p className="font-handwriting text-3xl sm:text-4xl text-rose-600 font-bold mt-0.5">{boyfriendName}</p>
            </div>
          </div>

          <div className="mt-4 flex flex-col items-center gap-2.5 z-20">
            <button
              onClick={handleConfetti}
              className="inline-flex items-center gap-2 px-8 py-3.5 rounded-full bg-gradient-to-r from-rose-500 via-pink-500 to-rose-600 hover:from-rose-600 text-white font-bold text-sm sm:text-base shadow-xl hover:scale-105 active:scale-95 transition-all"
            >
              <span>Shower With 1,000 Hearts ❤️</span>
            </button>
            <button onClick={onRestart} className="text-xs text-gray-500 hover:text-rose-600 font-medium py-1 px-3">
              🔄 Experience It From The Beginning
            </button>
            <footer className="text-[11px] text-gray-400 font-medium">Made with love by {boyfriendName} for {girlfriendName} 💕</footer>
          </div>
        </div>
      );
    }

    // Music Player Widget
    function MusicPlayer({ isPlaying, setIsPlaying }) {
      const audioRef = useRef(null);
      const audioUrl = './Naan%20Un%20Azhaginile%20BGM.mp3';
      const songTitle = 'Naan Un Azhaginile';

      useEffect(() => {
        const audio = audioRef.current;
        if (!audio) return;

        const startPlayback = () => {
          audio.play().catch(() => {});
          window.removeEventListener('pointerdown', startPlayback);
          window.removeEventListener('keydown', startPlayback);
        };

        audio.play().catch(() => {
          window.addEventListener('pointerdown', startPlayback, { once: true });
          window.addEventListener('keydown', startPlayback, { once: true });
        });

        return () => {
          window.removeEventListener('pointerdown', startPlayback);
          window.removeEventListener('keydown', startPlayback);
        };
      }, []);

      return (
        <div className="fixed bottom-4 right-4 z-50 select-none">
          <audio
            ref={audioRef}
            src={audioUrl}
            autoPlay
            loop
            onPlay={() => setIsPlaying(true)}
            onPause={() => setIsPlaying(false)}
          />
          <div className="glass-card rounded-2xl shadow-2xl p-2.5 border border-pink-200/80 flex items-center gap-2.5 backdrop-blur-xl">
            <button
              type="button"
              onClick={() => {
                if (isPlaying) audioRef.current?.pause();
                else audioRef.current?.play().catch(() => setIsPlaying(false));
              }}
              aria-label={isPlaying ? 'Pause song' : 'Play song'}
              title={isPlaying ? 'Pause song' : 'Play song'}
              className="relative cursor-pointer w-10 h-10 shrink-0 rounded-full bg-neutral-900 border-2 border-rose-400 flex items-center justify-center shadow-md"
            >
              <span className={`w-4 h-4 rounded-full bg-gradient-to-tr from-rose-500 to-pink-400 flex items-center justify-center text-[9px] ${isPlaying ? 'animate-spin-slow' : ''}`}>
                {isPlaying ? 'Ⅱ' : '▶'}
              </span>
            </button>
            <div className="min-w-0 max-w-40">
              <p className="truncate text-[11px] font-bold text-gray-800">🎵 {songTitle}</p>
              <p className="text-[9px] text-rose-500 font-medium">{isPlaying ? 'Playing' : 'Paused • Tap to play'}</p>
            </div>
          </div>
        </div>
      );
    }

    // Master App
    function App() {
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('surprise_story_data_v2');
        return saved ? { ...defaultData, ...JSON.parse(saved) } : defaultData;
      });
      const [currentScene, setCurrentScene] = useState(0);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [isMusicPlaying, setIsMusicPlaying] = useState(false);

      const totalScenes = 6;
      const chapters = [
        { title: "Delivery", emoji: "🛵" },
        { title: "The Letter", emoji: "💌" },
        { title: "Our Dance", emoji: "💃" },
        { title: "Little Things", emoji: "🌸" },
        { title: "A Poem", emoji: "📝" },
        { title: "Forever", emoji: "💍" }
      ];

      const goToScene = (sceneIndex) => {
        if (sceneIndex === currentScene || isTransitioning) return;
        setIsTransitioning(true);
        setTimeout(() => {
          setCurrentScene(sceneIndex);
          setIsTransitioning(false);
        }, 280);
      };

      const nextScene = () => {
        if (currentScene < totalScenes - 1) goToScene(currentScene + 1);
      };
      const prevScene = () => {
        if (currentScene > 0) goToScene(currentScene - 1);
      };

      return (
        <div className="relative w-screen h-screen overflow-hidden flex flex-col justify-between">
          <FloatingHearts />
          <TouchHearts />

          {/* Top Header */}
          <header className="relative z-40 px-4 py-2.5 flex items-center justify-between border-b border-rose-100/60 bg-white/40 backdrop-blur-md">
            <div className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/80 border border-pink-200 text-xs font-semibold text-rose-600 shadow-xs">
              <span>❤️ For {data.girlfriendName}</span>
            </div>

            <div className="flex items-center gap-1.5 sm:gap-2">
              {chapters.map((chap, idx) => (
                <button
                  key={idx}
                  onClick={() => goToScene(idx)}
                  className={`transition-all rounded-full flex items-center justify-center ${
                    currentScene === idx
                      ? 'w-8 h-8 bg-gradient-to-r from-rose-500 to-pink-500 text-white shadow-md scale-110'
                      : currentScene > idx
                      ? 'w-6 h-6 bg-rose-200 text-rose-700'
                      : 'w-6 h-6 bg-white/70 text-gray-400'
                  }`}
                  title={chap.title}
                >
                  <span className="text-xs">{chap.emoji}</span>
                </button>
              ))}
            </div>
          </header>

          {/* Main Stage */}
          <main className="relative flex-1 w-full overflow-hidden flex items-center justify-center p-2 sm:p-4">
            <div className={`w-full max-w-4xl h-full flex flex-col justify-center transition-all duration-300 ${isTransitioning ? 'opacity-0 scale-95' : 'opacity-100 scale-100 scene-enter'}`}>
              {currentScene === 0 && (
                <ScootyDeliveryIntro onComplete={nextScene} girlfriendName={data.girlfriendName} boyfriendName={data.boyfriendName} />
              )}
              {currentScene === 1 && (
                <HeartEnvelope data={data} onOpen={nextScene} />
              )}
              {currentScene === 2 && (
                <DancingCouples boyfriendName={data.boyfriendName} girlfriendName={data.girlfriendName} onNext={nextScene} />
              )}
              {currentScene === 3 && (
                <LoveReasons reasons={data.reasons} onNext={nextScene} />
              )}
              {currentScene === 4 && (
                <TamilPoem onNext={nextScene} />
              )}
              {currentScene === 5 && (
                <FinalPromise finalLetter={data.finalLetter} boyfriendName={data.boyfriendName} girlfriendName={data.girlfriendName} onRestart={() => goToScene(0)} />
              )}
            </div>
          </main>

          {/* Footer Navigation */}
          <footer className="relative z-40 px-4 py-2 flex items-center justify-between border-t border-rose-100/60 bg-white/40 backdrop-blur-md">
            <div>
              {currentScene > 0 ? (
                <button onClick={prevScene} className="px-3 py-1 rounded-full text-xs font-semibold text-gray-600 bg-white/70 hover:bg-white border border-rose-200">
                  ← Back
                </button>
              ) : (
                <span className="text-[11px] text-gray-400 pl-1">Delivery to Kandhasaamy Illam 🛵</span>
              )}
            </div>

            <div className="hidden sm:block">
              <span className="text-[11px] font-semibold text-rose-500 uppercase tracking-widest">
                Chapter {currentScene + 1} of {totalScenes}: {chapters[currentScene].title}
              </span>
            </div>

            <div>
              {currentScene < totalScenes - 1 ? (
                <button onClick={nextScene} className="px-3.5 py-1 rounded-full text-xs font-semibold text-white bg-gradient-to-r from-rose-500 to-pink-500">
                  Next →
                </button>
              ) : (
                <span className="text-[11px] text-rose-600 font-bold pr-1">Forever Yours ❤️</span>
              )}
            </div>
          </footer>

          <MusicPlayer isPlaying={isMusicPlaying} setIsPlaying={setIsMusicPlaying} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
